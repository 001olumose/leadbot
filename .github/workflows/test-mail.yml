name: Test email

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send one test email to yourself
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, smtplib
          from email.message import EmailMessage

          address = "ojeleyemoses698@gmail.com"
          message = EmailMessage()
          message["From"] = address
          message["To"] = address
          message["Subject"] = "LeadBot mailbox test"
          message.set_content(
              "If you can read this, LeadBot can send from your Gmail.\n\n"
              "Nothing else was sent to anyone."
          )

          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as server:
              server.starttls()
              server.login(address, os.environ["SMTP_PASSWORD"])
              server.send_message(message)
          print("test email sent to", address)
          PY
