name: LeadBot

on:
  schedule:
    # 06:00 UTC = 07:00 in Lagos. Change the hour if you prefer.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leadbot
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch LeadBot
        run: |
          set -euo pipefail
          url="https://site-b2033fe37d9c47bbb00da9e629c1a2a2.freebuff.page/leadbot.py"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "$url" -o leadbot.py
          python3 -c "import ast, sys; ast.parse(open('leadbot.py', encoding='utf-8').read())"
          test "$(wc -c < leadbot.py)" -gt 20000

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The bot remembers every post it has already shown, so yesterday's
      # leads do not come back today. That memory lives in output/seen.db,
      # which is restored from state/ and committed back at the end.
      - name: Restore memory
        run: |
          mkdir -p output state
          if [ -f state/seen.db ]; then cp state/seen.db output/seen.db; fi

      - name: Find leads
        run: python leadbot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      - name: Publish the feed
        run: |
          set -euo pipefail
          mkdir -p docs state
          # Rolling list: today's finds are added to the recent ones, so a quiet
          # morning never leaves the page with a shorter list than yesterday.
          python3 scripts/merge_feed.py output/leads.json docs/leads.json
          if [ -f output/seen.db ]; then cp output/seen.db state/seen.db; fi
          git config user.name "LeadBot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/leads.json state/seen.db
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          git commit -m "Leads for $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          echo "Could not push the feed after 3 attempts" >&2
          exit 1

      - name: Keep the report
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: |
            output/digest.html
            output/leads.csv
          retention-days: 30
